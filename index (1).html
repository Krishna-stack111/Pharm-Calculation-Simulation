<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmCalc | Pharmaceutical Calculations Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --panel:#FFFFFF; --ink:#16242B; --muted:#5B6B72; --line:#CBD5D6;
  --accent:#0B6E75; --accent-ink:#FFFFFF; --soft:#DDEBEA; --warn:#B4380F;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A1E; --panel:#16252B; --ink:#E6EEF0; --muted:#93A5AB; --line:#2B3E45;
        --accent:#4FC3CB; --accent-ink:#0F1A1E; --soft:#1F3A40; --warn:#FF9A73;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.5;padding:24px 16px 48px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:1.05rem;margin:0 0 4px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 14px}
label{display:block;font-size:.92rem;margin:12px 0 4px}
.field{display:flex;gap:8px;align-items:center}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.unit{color:var(--muted);min-width:56px;font-size:.88rem}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.result{padding:14px 0;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result .lbl{color:var(--muted);font-size:.9rem}
.result .val{font-size:2rem;font-weight:700;color:var(--accent);line-height:1.2}
.result .val small{font-size:.95rem;font-weight:400;color:var(--muted);margin-left:6px}
.result code{display:block;margin-top:4px;font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:.82rem;background:var(--soft);padding:6px 8px;border-radius:6px;overflow-x:auto}
.empty{color:var(--muted);padding:12px 0}
.msg{color:var(--warn);padding:8px 0}
footer{margin-top:24px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>PharmCalc</h1>
  <p class="sub">Pharmaceutical calculations with the working shown. Every answer comes with the equation and the numbers used, so you can check it at a glance.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="grid">
    <section class="panel">
      <h2 id="tTitle"></h2>
      <p class="note" id="tNote"></p>
      <div id="form"></div>
      <div class="actions">
        <button type="button" id="ex">Load example</button>
        <button type="button" id="clr">Clear</button>
      </div>
    </section>
    <section class="panel" aria-live="polite">
      <h2>Results and working</h2>
      <div id="out"></div>
    </section>
  </div>
  <footer>Educational tool. Verify critical formulation calculations independently before use in practice.</footer>
</div>

<script>
const f = x => {
  if (!isFinite(x)) return '–';
  const a = Math.abs(x);
  if (a !== 0 && (a >= 1e6 || a < 1e-3)) return x.toExponential(3);
  return String(+x.toPrecision(4));
};
const ok = x => isFinite(x) && x >= 0;
const R = (label, val, unit, eq) => ok(val) ? {label, val, unit, eq} : null;

const TABS = {
  conc: {
    name: 'Molarity, molality, normality',
    note: 'Enter what you know. Each result appears as soon as it can be worked out.',
    inputs: [
      ['mass','Solute mass','g'], ['mw','Molecular weight','g/mol'],
      ['vol','Solution volume','mL'], ['solv','Solvent mass','g'],
      ['nf','Equivalents per mole (n)','eq/mol']
    ],
    ex: {mass:58.44, mw:58.44, vol:1000, solv:960, nf:1},
    calc(v){
      const mol = v.mass / v.mw, M = mol / (v.vol/1000);
      return [
        R('Moles of solute', mol, 'mol', `n = mass ÷ MW = ${f(v.mass)} ÷ ${f(v.mw)}`),
        R('Molarity (M)', M, 'mol/L', `M = n ÷ V(L) = ${f(mol)} ÷ ${f(v.vol/1000)}`),
        R('Molality (m)', mol / (v.solv/1000), 'mol/kg', `m = n ÷ solvent(kg) = ${f(mol)} ÷ ${f(v.solv/1000)}`),
        R('Normality (N)', M * v.nf, 'eq/L', `N = M × n = ${f(M)} × ${f(v.nf)}`)
      ];
    }
  },
  pct: {
    name: 'Percentage concentrations',
    note: 'Give any of the amounts below to get % w/v, % w/w and % v/v.',
    inputs: [
      ['sm','Solute mass','g'], ['sv','Solute volume','mL'],
      ['vol','Solution volume','mL'], ['wt','Solution mass','g']
    ],
    ex: {sm:5, sv:5, vol:100, wt:104},
    calc(v){
      return [
        R('Weight in volume (% w/v)', v.sm / v.vol * 100, 'g/100 mL', `% w/v = solute g ÷ solution mL × 100 = ${f(v.sm)} ÷ ${f(v.vol)} × 100`),
        R('Weight in weight (% w/w)', v.sm / v.wt * 100, 'g/100 g', `% w/w = solute g ÷ solution g × 100 = ${f(v.sm)} ÷ ${f(v.wt)} × 100`),
        R('Volume in volume (% v/v)', v.sv / v.vol * 100, 'mL/100 mL', `% v/v = solute mL ÷ solution mL × 100 = ${f(v.sv)} ÷ ${f(v.vol)} × 100`)
      ];
    }
  },
  conv: {
    name: 'Convert between expressions',
    note: 'Pick what you have, then supply the extra data it needs: M and N need MW (N also needs n); % w/w and molality need density.',
    inputs: [
      ['from','Convert from','', ['% w/v','% w/w','Molarity (M)','Molality (m)','Normality (N)']],
      ['val','Value',''], ['mw','Molecular weight','g/mol'],
      ['rho','Solution density','g/mL'], ['nf','Equivalents per mole (n)','eq/mol']
    ],
    ex: {from:'Molarity (M)', val:1, mw:58.44, rho:1.04, nf:1},
    calc(v){
      const {from:fr, val:x, mw, rho, nf} = v;
      let c = NaN, how = '';
      if (fr==='% w/v'){ c = x*10; how = `c = % w/v × 10 = ${f(x)} × 10`; }
      if (fr==='Molarity (M)'){ c = x*mw; how = `c = M × MW = ${f(x)} × ${f(mw)}`; }
      if (fr==='Normality (N)'){ c = x/nf*mw; how = `c = N ÷ n × MW = ${f(x)} ÷ ${f(nf)} × ${f(mw)}`; }
      if (fr==='% w/w'){ c = 10*x*rho; how = `c = % w/w × ρ × 10 = ${f(x)} × ${f(rho)} × 10`; }
      if (fr==='Molality (m)'){ c = 1000*rho*x/(1000/mw + x); how = `c = 1000·ρ·m ÷ (1000/MW + m) = 1000 × ${f(rho)} × ${f(x)} ÷ (1000/${f(mw)} + ${f(x)})`; }
      if (!ok(c)) return [];
      if (c >= 1000*rho) return [{err:'That strength is not possible: the solute alone would outweigh 1 L of solution. Check the density and value.'}];
      const M = c/mw;
      return [
        R('Solute per litre of solution (c)', c, 'g/L', how),
        fr!=='% w/v' && R('% w/v', c/10, 'g/100 mL', `% w/v = c ÷ 10 = ${f(c)} ÷ 10`),
        fr!=='Molarity (M)' && R('Molarity (M)', M, 'mol/L', `M = c ÷ MW = ${f(c)} ÷ ${f(mw)}`),
        fr!=='Normality (N)' && R('Normality (N)', M*nf, 'eq/L', `N = M × n = ${f(M)} × ${f(nf)}`),
        fr!=='% w/w' && R('% w/w', c/(10*rho), 'g/100 g', `% w/w = c ÷ (10 × ρ) = ${f(c)} ÷ (10 × ${f(rho)})`),
        fr!=='Molality (m)' && R('Molality (m)', M*1000/(1000*rho - c), 'mol/kg', `m = (c ÷ MW) × 1000 ÷ (1000ρ − c) = ${f(M)} × 1000 ÷ (${f(1000*rho)} − ${f(c)})`)
      ];
    }
  },
  stock: {
    name: 'Stock strength and dilution',
    note: 'From a concentrated stock (such as an acid sold as % w/w), find its molarity and how much to measure out for a target solution.',
    inputs: [
      ['pct','Stock strength','% w/w'], ['rho','Stock density','g/mL'],
      ['mw','Molecular weight','g/mol'], ['nf','Equivalents per mole (n)','eq/mol'],
      ['tm','Target molarity','mol/L'], ['fv','Final volume','mL']
    ],
    ex: {pct:37, rho:1.18, mw:36.46, nf:1, tm:0.1, fv:500},
    calc(v){
      const M = v.pct*v.rho*10/v.mw;
      const vs = v.tm*v.fv/M;
      return [
        R('Stock molarity', M, 'mol/L', `M = % w/w × ρ × 10 ÷ MW = ${f(v.pct)} × ${f(v.rho)} × 10 ÷ ${f(v.mw)}`),
        R('Stock normality', M*v.nf, 'eq/L', `N = M × n = ${f(M)} × ${f(v.nf)}`),
        R('Stock volume to measure', vs, 'mL', `C₁V₁ = C₂V₂, so V₁ = ${f(v.tm)} × ${f(v.fv)} ÷ ${f(M)}`),
        R('Stock mass to weigh', vs*v.rho, 'g', `mass = V₁ × ρ = ${f(vs)} × ${f(v.rho)}`),
        R('Diluent to make up to volume', v.fv - vs, 'mL', `diluent = final − stock = ${f(v.fv)} − ${f(vs)}`)
      ];
    }
  },
  dens: {
    name: 'Mass, volume and density',
    note: 'Fill any two fields. The third is calculated.',
    inputs: [['m','Mass','g'], ['vv','Volume','mL'], ['d','Density','g/mL']],
    ex: {m:25, vv:20, d:''},
    calc(v){
      const k = ['m','vv','d'].filter(x => isFinite(v[x])).length;
      if (k !== 2) return [];
      if (!isFinite(v.d)) return [R('Density', v.m/v.vv, 'g/mL', `ρ = m ÷ V = ${f(v.m)} ÷ ${f(v.vv)}`)];
      if (!isFinite(v.m)) return [R('Mass', v.d*v.vv, 'g', `m = ρ × V = ${f(v.d)} × ${f(v.vv)}`)];
      return [R('Volume', v.m/v.d, 'mL', `V = m ÷ ρ = ${f(v.m)} ÷ ${f(v.d)}`)];
    }
  }
};

const tabsEl = document.getElementById('tabs'), form = document.getElementById('form'), out = document.getElementById('out');
let cur = 'conc';

function build(){
  const t = TABS[cur];
  document.getElementById('tTitle').textContent = t.name;
  document.getElementById('tNote').textContent = t.note;
  form.innerHTML = t.inputs.map(([id,lab,unit,opts]) => `
    <label for="${id}">${lab}</label>
    <div class="field">
      ${opts ? `<select id="${id}">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`
             : `<input id="${id}" type="number" step="any" min="0" inputmode="decimal">`}
      <span class="unit">${unit}</span>
    </div>`).join('');
  form.querySelectorAll('input,select').forEach(e => e.addEventListener('input', run));
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.k === cur));
  run();
}

function run(){
  const t = TABS[cur], v = {};
  t.inputs.forEach(([id,,,opts]) => {
    const e = document.getElementById(id);
    v[id] = opts ? e.value : (e.value.trim() === '' ? NaN : parseFloat(e.value));
  });
  const rows = t.calc(v).filter(Boolean);
  out.innerHTML = rows.length ? rows.map(r => r.err
    ? `<div class="msg">${r.err}</div>`
    : `<div class="result"><div class="lbl">${r.label}</div><div class="val">${f(r.val)}<small>${r.unit}</small></div><code>${r.eq}</code></div>`).join('')
    : '<div class="empty">Enter values on the left to see results and the working here.</div>';
}

Object.entries(TABS).forEach(([k,t]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.k = k; b.textContent = t.name; b.setAttribute('role','tab');
  b.onclick = () => { cur = k; build(); };
  tabsEl.appendChild(b);
});
document.getElementById('ex').onclick = () => {
  Object.entries(TABS[cur].ex).forEach(([id,val]) => { document.getElementById(id).value = val; });
  run();
};
document.getElementById('clr').onclick = () => {
  TABS[cur].inputs.forEach(([id,,,opts]) => { if (!opts) document.getElementById(id).value = ''; });
  run();
};
build();
</script>
</body>
</html>
